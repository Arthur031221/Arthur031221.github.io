<!doctype html>
<html lang="en" data-mode="vivo" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#05070d">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="Chi-Wei Lee — PE//1">
<meta property="og:image" content="https://arthur031221.github.io/img/art/home-ink.webp">
<meta property="og:image:alt" content="Indigo sumi ink and woodblock contours on warm paper">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://arthur031221.github.io/img/art/home-ink.webp">
<link rel="preload" href="assets/fonts/MartianMono-normal-100-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/InstrumentSans-normal-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<script>document.documentElement.classList.remove('no-js');try{var m=localStorage.getItem('pe.mode');if(!m)m=matchMedia('(prefers-color-scheme: light)').matches?'fixed':'vivo';document.documentElement.setAttribute('data-mode',m);var l=localStorage.getItem('pe.lang');if(l)document.documentElement.setAttribute('lang',l==='zh'?'zh-Hant':'en');}catch(e){}</script>
{{jsonld}}
</head>
<body>

<canvas id="substrate" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="wash" aria-hidden="true"></div>
<div id="reenc" aria-hidden="true"></div>

<a class="skip" href="#main"><span class="en">Skip to content</span><span class="zh">跳至內容</span></a>

<header class="bar">
  <a class="id" href="index.html" aria-label="Chi-Wei Lee — home">
    <span class="seal" aria-hidden="true">李</span>
    <b><span class="en">CHI-WEI LEE</span><span class="zh">李騏維</span></b>
    <span class="sep" aria-hidden="true">/</span>
    <span class="role"><span class="en">RESEARCH NOTEBOOK</span><span class="zh">研究手帖</span></span>
  </a>
  <nav aria-label="Sections">{{nav}}</nav>
  <div class="ctl">
    <button type="button" data-act="console" aria-label="Open command console" data-rf="console">
      <span class="lb">⌘K</span>
    </button>
    <button type="button" data-act="lang" aria-label="Switch language"><span class="lb">中</span><span class="k">L</span></button>
    <button type="button" data-act="mode" aria-label="Switch colour theme"><span class="mode-glyph" aria-hidden="true">◐</span><span class="lb">NIGHT</span><span class="k">T</span></button>
  </div>
  <button type="button" class="burger" data-act="drawer" aria-label="Menu" aria-controls="drawer" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

<div class="shell">
  <main id="main">
{{main}}
    <footer class="foot">
      <span><span class="en">Chi-Wei Lee · Taiwan ↔ UCLA</span><span class="zh">李騏維 · 台灣 ↔ UCLA</span></span>
      <a href="https://github.com/Arthur031221" rel="noopener">GITHUB</a>
      <button type="button" data-act="mail" data-mail="levi74108520963@gmail.com"><span class="en">COPY EMAIL</span><span class="zh">複製信箱</span></button>
      <a href="Chi-Wei_Lee_CV.pdf">CV.PDF</a>
      <span class="r"><span class="en">Predictive coding · Bayesian inference · NeuroAI</span><span class="zh">預測編碼 · 貝氏推論 · NeuroAI</span></span>
    </footer>
  </main>
</div>

<nav id="drawer" aria-label="Mobile sections" aria-hidden="true" inert>{{drawer}}</nav>

<dialog id="console" aria-label="Command console">
  <div class="box">
    <div class="bh"><span class="led"></span><span class="en">STIMULUS CONSOLE</span><span class="zh">刺激控制台</span><span class="esc">ESC</span></div>
    <input type="text" autocomplete="off" spellcheck="false" placeholder="Type a command…" aria-label="Command">
    <ul role="listbox"></ul>
  </div>
</dialog>

<dialog id="lightbox" aria-label="Photograph">
  <div class="lb">
    <div class="lb-media" data-lb-media></div>
    <div class="lbar">
      <span class="n">01 / 01</span>
      <span class="cap"></span>
      <span class="sp">
        <button type="button" data-lb-close><span class="en">CLOSE ×</span><span class="zh">關閉 ×</span></button>
        <button type="button" data-lb-nav="prev" aria-label="Previous">← PREV</button>
        <button type="button" data-lb-nav="next" aria-label="Next">NEXT →</button>
      </span>
    </div>
  </div>
</dialog>

<noscript>
  <style>#substrate,#boot,.rail,.depth{display:none}.err{opacity:1!important;transform:none!important;filter:none!important}</style>
</noscript>

<script src="assets/runtime.js" defer></script>
<script src="assets/substrate.js" defer></script>
</body>
</html>
