/* ══════════════════════════════════════════════════════════════════════
   THE SUBSTRATE — bubbles
   One full-viewport canvas behind every page. Bubbles rise, wobble on a
   noise field, and are pushed out of the way by the pointer. They read as
   volume rather than as a texture printed on the background.

   One rAF loop for the whole site: throttled hard when nothing is moving,
   suspended when the tab is hidden.
   ══════════════════════════════════════════════════════════════════════ */
(() => {
  if (root.dataset.motion === 'reduced') return;

  const cvs = document.createElement('canvas');
  cvs.className = 'substrate';
  cvs.setAttribute('aria-hidden', 'true');
  document.body.prepend(cvs);
  const ctx = cvs.getContext('2d', { alpha: true });
  if (!ctx) { cvs.remove(); return; }

  const css = v => getComputedStyle(root).getPropertyValue(v).trim();

  let W = 0, H = 0, dpr = 1;
  let scrollV = 0, lastY = scrollY;
  let px = -1e4, py = -1e4;
  let idle = 0, raf = 0, t = 0;

  /* ── bubbles ──────────────────────────────────────────────────────── */
  let B = [];
  const count = () => (innerWidth < 760 ? 26 : Math.min(70, Math.round(innerWidth * innerHeight / 26000)));

  function make(seeded) {
    // A spread of sizes is what stops it reading as a particle system: a few
    // large slow ones carry the volume, the small fast ones carry the life.
    const big = Math.random() < 0.22;
    const r = big ? 26 + Math.random() * 52 : 4 + Math.random() * 16;
    return {
      x: Math.random() * W,
      y: seeded ? Math.random() * H : H + r + Math.random() * 90,
      r,
      // buoyancy: bigger bubbles rise faster, as they do
      vy: -(0.10 + r * 0.0072) * (0.75 + Math.random() * 0.5),
      vx: 0,
      phase: Math.random() * Math.PI * 2,
      wob: 0.4 + Math.random() * 0.9,
      alpha: big ? 0.16 + Math.random() * 0.14 : 0.22 + Math.random() * 0.26,
    };
  }
  const seed = () => { B = Array.from({ length: count() }, () => make(true)); };

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const accent = css('--accent') || '#4FE0A0';
    const light = root.dataset.theme === 'light';

    for (const b of B) {
      ctx.globalAlpha = b.alpha;

      if (light) {
        // publication register: an ink outline, no glow
        ctx.strokeStyle = accent;
        ctx.lineWidth = b.r > 24 ? 1.3 : 1;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
        // a second inner arc gives the outline some body on paper
        ctx.globalAlpha = b.alpha * 0.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.82, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
      } else {
        // instrument register: a soft membrane with a rim and a highlight,
        // which is what actually makes a circle read as a bubble
        const g = ctx.createRadialGradient(b.x, b.y, b.r * 0.15, b.x, b.y, b.r);
        g.addColorStop(0, 'transparent');
        g.addColorStop(0.72, 'transparent');
        g.addColorStop(0.93, accent);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();

        ctx.globalAlpha = b.alpha * 0.55;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.33, b.y - b.r * 0.36, Math.max(0.8, b.r * 0.11), 0, 7);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function step() {
    t += 0.006;
    for (const b of B) {
      b.phase += 0.012 * b.wob;
      // wobble sideways, and drift with the scroll
      b.vx = Math.sin(b.phase + b.y * 0.004) * 0.42 * b.wob;
      b.x += b.vx;
      b.y += b.vy - scrollV * 0.05;

      // the pointer shoulders them aside
      const dx = b.x - px, dy = b.y - py;
      const d2 = dx * dx + dy * dy;
      const reach = (b.r + 110) ** 2;
      if (d2 < reach && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const f = (1 - d2 / reach) * 3.2;
        b.x += (dx / d) * f;
        b.y += (dy / d) * f;
      }

      if (b.y + b.r < -30 || b.x < -140 || b.x > W + 140) Object.assign(b, make(false));
    }
    scrollV *= 0.90;
  }

  function frame() {
    raf = requestAnimationFrame(frame);
    idle++;
    if (Math.abs(scrollV) > 0.4) idle = 0;
    if (idle > 140 && (idle & 1)) return;   // half rate once everything settles
    step(); draw();
  }

  addEventListener('scroll', () => {
    const y = scrollY;
    scrollV = y - lastY; lastY = y;
    const max = Math.max(1, document.body.scrollHeight - innerHeight);
    root.style.setProperty('--sp', (y / max).toFixed(4));
  }, { passive: true });

  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; idle = 0; }, { passive: true });
  addEventListener('pointerleave', () => { px = py = -1e4; }, { passive: true });

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else raf = requestAnimationFrame(frame);
  });

  resize();
  raf = requestAnimationFrame(frame);
})();


/* ══════════════════════════════════════════════════════════════════════
   KINETIC TYPE — headings shear with scroll velocity and settle.
   The page has weight; typography that ignores that reads as a screenshot.
   ══════════════════════════════════════════════════════════════════════ */
(() => {
  if (root.dataset.motion === 'reduced') return;
  const targets = [...document.querySelectorAll('.sec-t, .page-head h1, .essay-head h1, .hero-name')];
  if (!targets.length) return;
  let v = 0, last = scrollY, queued = false;
  const apply = () => {
    queued = false;
    const s = Math.max(-1, Math.min(1, v / 46));
    targets.forEach(el => {
      el.style.transform = `skewY(${(s * 1.6).toFixed(2)}deg) translateY(${(s * -5).toFixed(1)}px)`;
    });
    v *= 0.86;
    if (Math.abs(v) > 0.3) requestAnimationFrame(apply);
    else targets.forEach(el => { el.style.transform = ''; });
  };
  addEventListener('scroll', () => {
    v = scrollY - last; last = scrollY;
    if (!queued) { queued = true; requestAnimationFrame(apply); }
  }, { passive: true });
})();


/* ══════════════════════════════════════════════════════════════════════
   I5 · PHOTO ⇄ PARTICLES
   The essay hero is sampled into particles and reassembled on entry, using
   the same retrieval framing as the site's thesis: a corrupted field
   resolving into a picture.
   ══════════════════════════════════════════════════════════════════════ */
(() => {
  if (root.dataset.motion === 'reduced') return;
  const fig = document.querySelector('.essay .ph-bleed');
  if (!fig) return;
  const img = fig.querySelector('img');
  if (!img) return;

  const cvs = document.createElement('canvas');
  cvs.className = 'ph-particles';
  cvs.setAttribute('aria-hidden', 'true');
  img.after(cvs);
  const ctx = cvs.getContext('2d');
  if (!ctx) { cvs.remove(); return; }

  let pts = [], W = 0, H = 0, raf = 0, done = false;

  function build() {
    const r = img.getBoundingClientRect();
    W = Math.round(r.width); H = Math.round(r.height);
    if (!W || !H) return false;
    const dpr = Math.min(devicePixelRatio || 1, 1.6);
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // sample the decoded image on an offscreen canvas
    const off = document.createElement('canvas');
    const step = innerWidth < 760 ? 9 : 6;
    const cols = Math.floor(W / step), rows = Math.floor(H / step);
    off.width = cols; off.height = rows;
    const octx = off.getContext('2d', { willReadFrequently: true });
    if (!octx) return false;
    try { octx.drawImage(img, 0, 0, cols, rows); } catch { return false; }
    const d = octx.getImageData(0, 0, cols, rows).data;

    pts = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = (j * cols + i) * 4;
      const lum = (d[k] * 0.2126 + d[k + 1] * 0.7152 + d[k + 2] * 0.0722) / 255;
      if (lum < 0.14) continue;                       // skip dead shadow
      pts.push({
        tx: i * step + step / 2, ty: j * step + step / 2,
        x: Math.random() * W, y: Math.random() * H,
        r: d[k], g: d[k + 1], b: d[k + 2], a: 0.25 + lum * 0.75,
      });
    }
    return pts.length > 0;
  }

  let t0 = 0;
  function run(now) {
    if (!t0) t0 = now;
    const k = Math.min(1, (now - t0) / 1500);
    const e = 1 - Math.pow(1 - k, 3);
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const x = p.x + (p.tx - p.x) * e;
      const y = p.y + (p.ty - p.y) * e;
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.a * (1 - e * 0.15)})`;
      ctx.fillRect(x, y, 2, 2);
    }
    if (k < 1) raf = requestAnimationFrame(run);
    else { fig.dataset.assembled = '1'; done = true; }
  }

  const start = () => {
    if (done || !img.complete || !img.naturalWidth) return;
    if (!build()) { fig.dataset.assembled = '1'; return; }
    fig.dataset.assembled = '0';
    t0 = 0; raf = requestAnimationFrame(run);
  };

  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { io.disconnect(); start(); }
  }, { threshold: 0.15 });

  if (img.complete && img.naturalWidth) io.observe(fig);
  else img.addEventListener('load', () => io.observe(fig));
})();


/* ══════════════════════════════════════════════════════════════════════
   PAGE TRANSITION CURTAIN
   A full-viewport wipe carrying the destination's name, so navigation reads
   as moving between places rather than swapping documents.
   ══════════════════════════════════════════════════════════════════════ */
(() => {
  if (root.dataset.motion === 'reduced') return;
  if (!document.startViewTransition) return;

  const curtain = document.createElement('div');
  curtain.className = 'curtain';
  curtain.innerHTML = '<span class="curtain-t mono"></span>';
  document.body.appendChild(curtain);
  const label = curtain.querySelector('.curtain-t');

  addEventListener('pageswap', () => { curtain.dataset.on = '1'; });
  addEventListener('pagereveal', () => {
    curtain.dataset.on = '0';
  });

  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const u = new URL(a.href, location.href);
    if (u.origin !== location.origin || u.pathname === location.pathname) return;
    if (a.target === '_blank' || u.pathname.endsWith('.pdf')) return;
    const txt = (a.querySelector('[data-en],[data-zh]') || a).textContent.trim();
    label.textContent = txt.slice(0, 40);
  }, true);
})();
