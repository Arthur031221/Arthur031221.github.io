<script id="content" type="application/json">{"meta":{"name":{"en":"Chi-Wei Lee","zh":"李騏維"},"handle":"Arthur","role":{"en":"NeuroAI researcher","zh":"腦神經 × 機器學習研究者"},"tagline":{"en":"Predictive coding, associative memory, and Bayesian inference — in brains and in machines.","zh":"預測編碼、聯想記憶,以及大腦與機器中的貝氏推論。"},"email":"levi74108520963@gmail.com","github":"https://github.com/Arthur031221","site":"https://arthur031221.github.io/","cv":"Chi-Wei_Lee_CV.pdf","location":{"en":"Hsinchu, Taiwan · currently at UCLA","zh":"台灣新竹 · 現於 UCLA"}},"about":{"lead":{"en":"I work on how brains and machines perform inference under uncertainty — and on the shared limits of both.","zh":"我研究大腦與機器如何在不確定下做推論,以及兩者共同的極限。"},"body":{"en":["I am a B.S. graduate of National Tsing Hua University, where I double-majored in Physics and Electrical Engineering & Computer Science (AI Track).","My theory work asks what predictive coding needs in order to remember. Two first-co-authored manuscripts are under review: one establishes a Tweedie–Hopfield correspondence identifying associative memory as the Bayesian denoiser that predictive coding implicitly requires; the other replaces the deterministic MAP inference of temporal predictive coding with preconditioned Langevin dynamics, so the filtering posterior becomes the flow's unique stationary density.","My empirical work points the same machinery at real neural data: I am reconstructing 3D spatial representations from fMRI signals with generative decoding models at the Human-Centered Machine Intelligence Lab, under Prof. Po-Chih Kuo.","Before that I worked on diffusion models and robustness — controllable generation at Academia Sinica, and subgroup generalisation in chest X-ray classification."],"zh":["我畢業於國立清華大學,雙主修物理系與電機資訊學院學士班(AI 組)。","理論方面,我在問一個問題:預測編碼要能夠「記憶」,需要什麼?兩篇共同第一作者的論文正在 審查中——一篇建立 Tweedie–Hopfield 對應關係,指認出聯想記憶正是預測編碼在推論時暗中需要的貝氏去噪器;另一篇把時間預測編碼的確定性 MAP 推論換成加了 preconditioner 的 Langevin 動力學,讓濾波後驗成為該流的唯一穩態分佈。","實證方面,我把同一套機制指向真實的神經資料:在郭柏志老師的 Human-Centered Machine Intelligence Lab,用生成式解碼模型從 fMRI 訊號重建三維空間表徵。","在那之前,我做的是 diffusion 模型與穩健性——中研院的可控生成研究,以及胸腔 X 光分類的子群泛化問題。"]},"facts":[{"k":{"en":"University","zh":"學校"},"v":{"en":"National Tsing Hua University","zh":"國立清華大學"}},{"k":{"en":"Major","zh":"主修"},"v":{"en":"Physics × EECS (AI Track), double major","zh":"物理系 × 電資學士班(AI 組),雙主修"}},{"k":{"en":"Now","zh":"現況"},"v":{"en":"HMI Lab, NTHU · visiting UCLA","zh":"清華 HMI Lab · 訪問 UCLA"}},{"k":{"en":"Looking for","zh":"尋找"},"v":{"en":"PhD positions in NeuroAI, 2027 entry","zh":"NeuroAI 博士班,2027 入學"}}]},"threads":[{"id":"pc","tag":{"en":"Theory","zh":"理論"},"title":{"en":"Predictive coding needs a memory","zh":"預測編碼需要記憶"},"body":{"en":"Predictive coding gives you a generative hierarchy but no content-addressable memory; modern Hopfield networks give you retrieval but no hierarchy. Both, it turns out, implicitly require the same object — a Bayesian denoiser. Making that precise yields HOPE, a single energy over hierarchical inference, temporal prediction and layer-wise memory, learned with local Hebbian updates alone.","zh":"預測編碼給你一個生成式階層,但沒有內容定址的記憶;modern Hopfield 網路給你檢索,但沒有階層。結果是,兩者暗中需要的是同一個東西——一個貝氏去噪器。把這件事講精確,就導出 HOPE:一個同時涵蓋階層推論、時間預測與逐層記憶的能量函數,而且只用局部 Hebbian 更新就能學習。"}},{"id":"langevin","tag":{"en":"Theory","zh":"理論"},"title":{"en":"Inference should sample, not just peak","zh":"推論應該取樣,而不只是找峰"},"body":{"en":"Temporal predictive coding descends the energy deterministically, so it returns only the posterior's MAP mode — and throws away every other explanation the data admits. Pairing overdamped Langevin dynamics to a preconditioner through the fluctuation–dissipation relation makes the filtering posterior the flow's unique stationary density: the inference now carries the whole shape of the belief.","zh":"時間預測編碼是在能量上做確定性的梯度下降,所以只會回傳後驗的 MAP 峰值——並且丟掉資料容許的其他所有解釋。把 overdamped Langevin 動力學透過漲落–耗散關係與 preconditioner 配對,能讓濾波後驗成為該流的唯一穩態分佈:推論從此帶著信念的完整形狀。"}},{"id":"fmri","tag":{"en":"Neural data","zh":"神經資料"},"title":{"en":"Reading space out of the brain","zh":"從大腦裡讀出空間"},"body":{"en":"At the HMI Lab I am building generative decoding models that reconstruct 3D spatial representations from fMRI. The theory above is not decoration here — the same question about what a posterior should carry decides what a decoder is allowed to claim it has recovered.","zh":"在 HMI Lab,我在建生成式解碼模型,從 fMRI 訊號重建三維空間表徵。上面的理論在這裡不是裝飾——「後驗應該承載什麼」這個問題,直接決定了一個解碼器可以宣稱自己還原了什麼。"}},{"id":"diffusion","tag":{"en":"Generative","zh":"生成模型"},"title":{"en":"Control without losing the picture","zh":"在不失去畫面的前提下控制"},"body":{"en":"MatrixQR decouples scan reliability from creative editing in QR-code generation, so aesthetics and function stop fighting each other. Langevin dynamics is the mathematical core of score-based diffusion — this line of work and the theory above are the same mathematics wearing different clothes.","zh":"MatrixQR 把掃描可靠性與創意編輯解耦,讓 QR code 的美觀與功能不再互相打架。Langevin 動力學正是 score-based diffusion 的數學核心——這條線和上面的理論,其實是同一套數學換了身衣服。"}}],"publications":[{"status":"review","title":"Predictive Coding with a Sequential Memory-Driven Bayesian Denoiser","authors":"C.-W. Lee (co-first author) et al.","venue":"Preprint · under submission","badge":{"en":"Under review","zh":"審查中"},"year":"2026","note":{"en":"A Tweedie–Hopfield correspondence identifies associative memory as the Bayesian denoiser predictive coding implicitly requires, yielding HOPE. Beats predictive-coding and Hopfield baselines on Bouncing Moving-MNIST and UCF-101 recall using only local Hebbian updates — no BPTT, no weight transport.","zh":"以 Tweedie–Hopfield 對應關係指認出聯想記憶就是預測編碼暗中需要的貝氏去噪器,並由此導出 HOPE。在 Bouncing Moving-MNIST 與 UCF-101 的序列回憶上勝過雙方 baseline,而且只用局部 Hebbian 更新——不需 BPTT,不需權重傳輸。"}},{"status":"review","title":"Langevin Temporal Predictive Coding Lifts Modes to Multimodal Densities","authors":"C.-W. Lee (co-first author) et al.","venue":"Preprint · under submission","badge":{"en":"Under review","zh":"審查中"},"year":"2026","note":{"en":"Replaces the deterministic MAP inference of temporal predictive coding with preconditioned Langevin dynamics. Lifts posterior mode coverage from 19.4% to 71.3% (3.67×) and cuts predictive MAE 16.7% (22.3% on naturally multimodal tasks) over twelve UCI benchmarks.","zh":"把時間預測編碼的確定性 MAP 推論換成 preconditioned Langevin 動力學。在十二個 UCI benchmark 上,後驗模式涵蓋率從 19.4% 提升到 71.3%(3.67 倍),預測 MAE 降低 16.7%(天生多峰的任務上降 22.3%)。"}},{"status":"accepted","title":"MatrixQR: Matrix-Guided Refinement for Decoupling Reliability Control from Creative Edits in QR Code Generation","authors":"C.-W. Lee, Y.-H. Hsueh, J.-A. Guo, J.-W. Liao, P.-Y. Chiu, J.-C. Chen","venue":"TAAI 2025","badge":{"en":"Accepted · poster","zh":"已接受 · 海報"},"year":"2025","note":{"en":"Extended abstract. Full paper in preparation.","zh":"延伸摘要。完整論文撰寫中。"}},{"status":"published","title":"Classifying Vibration Modes Generated by the Michelson Interferometer Using Machine Learning Methods","authors":"X.-H. Tsai, A. A.-C. Yeh, C.-H. Lu, S.-Y. Chou, S.-W. Wang, C.-W. Lee, P.-H. Lee","venue":"Journal of Modern Physics 15(12)","badge":{"en":"Published","zh":"已發表"},"year":"2024","doi":"https://doi.org/10.4236/jmp.2024.1512087","note":{"en":"","zh":""}},{"status":"service","title":"Building Machine Learning Challenges for Anomaly Detection in Science","authors":"E. G. Campolongo, Y.-T. Chou, E. Govorkova, … C.-W. Lee … (150+ authors)","venue":"arXiv:2503.02112 · preprint, under submission","badge":{"en":"Co-author","zh":"共同作者"},"year":"2025","doi":"https://arxiv.org/abs/2503.02112","note":{"en":"A community benchmark paper arising from the NSF HDR ML Challenge. Contributors are listed alphabetically after the organising authors, so position carries no seniority. My contribution was feedback on benchmark positioning, baselines, metrics and clarity.","zh":"源自 NSF HDR ML Challenge 的社群 benchmark 論文。核心組織者之後的貢獻者依姓氏字母排序,因此作者順序不代表貢獻程度。我的貢獻是對 benchmark 定位、baseline、評估指標與表述清晰度提供意見。"}}],"awards":[{"year":"2026","title":{"en":"Mei Yi-Chi Memorial Medal","zh":"梅貽琦紀念獎章"},"org":{"en":"National Tsing Hua University","zh":"國立清華大學"},"hero":true,"note":{"en":"NTHU's highest honour for graduating students — 1 of 8 university-wide, sole recipient in the College of Science, and the only Physics recipient in nine years.","zh":"清華大學畢業生最高榮譽——全校僅 8 位獲獎者,理學院唯一獲獎者,亦是物理系近九年來唯一獲獎者。"}},{"year":"2025","title":{"en":"2nd worldwide — NSF HDR ML Challenge","zh":"全球第二 — NSF HDR ML Challenge"},"org":{"en":"U.S. National Science Foundation · Overall Track","zh":"美國國家科學基金會 · 總積分"},"hero":true,"note":{"en":"2nd of 600+ teams worldwide. Team lead of six. Invited to present at the AAAI-25 Workshop in Philadelphia.","zh":"全球 600 支以上隊伍中排名第二。六人團隊隊長。受邀於費城 AAAI-25 Workshop 發表。"}},{"year":"2026","title":{"en":"3rd worldwide — NSF HDR ML Challenge","zh":"全球第三 — NSF HDR ML Challenge"},"org":{"en":"Climate Prediction Track","zh":"氣候預測賽道"},"note":{"en":"Attention-based models with specialised preprocessing for drought prediction, focused on out-of-distribution generalisation.","zh":"以注意力模型搭配特化前處理進行乾旱預測,聚焦於分佈外泛化。"}},{"year":"2025","title":{"en":"1st place — Mei-Chu Hackathon","zh":"第一名 — 梅竹黑客松"},"org":{"en":"Maker Track","zh":"Maker 組"},"note":{"en":"A wearable-and-app system modelling walking trajectories for dementia safety monitoring.","zh":"穿戴裝置結合行動應用,建模失智症患者行走軌跡以進行安全監測。"}},{"year":"2023","title":{"en":"Gold Medal — iGEM","zh":"金牌 — iGEM"},"org":{"en":"NTHU-Taiwan · Dry Lab Lead","zh":"NTHU-Taiwan · Dry Lab 組長"},"note":{"en":"Machine-learning colorectal-cancer screening with an Arduino-integrated diagnostic device. Presented in Paris.","zh":"以機器學習進行大腸癌篩檢,並整合 Arduino 自動化診斷裝置。於巴黎發表。"}}],"longreads":{"nsf":{"title":{"en":"20 days, 20 iterations","zh":"20 天,20 次迭代"},"place":"Philadelphia · New York","date":"2025.02.28 – 03.09","hero":"img/NSF1","photos":[{"src":"img/NSF1","fx":"50%","fy":"34%","role":"hero","slug":"PHL · 39.95 N, 75.16 W · 2025-03 · NSF HDR","cap":{"en":"The six of us — team 20iterations","zh":"我們六個 —— 20iterations"}},{"src":"img/NSF0","fx":"50%","fy":"42%","role":"plate","slug":"PHL · AAAI-25 WORKSHOP · 2025-03-01","cap":{"en":"AAAI-25 workshop, Philadelphia","zh":"費城 AAAI-25 workshop"}},{"src":"img/NSF2","fx":"50%","fy":"40%","role":"bleed","slug":"PHL · 2ND OF 600+ TEAMS · 2025-03","cap":{"en":"Second worldwide, of 600+ teams","zh":"600 支以上隊伍中的全球第二"}}],"zh":["美國 -- 一個我一直很想去的國家，隔著太平洋不知道什麼時候才能真正踏上這片土地，但就在一場不到一個月就截止，且幾乎不可能獲得優勝的競賽中，隨著凌晨收到的一封來自美國的郵件，這一天居然就這樣提早來了，讓我前往這只存在我想像中的世界。","NSF HDR ML Challenge 異常檢測黑客松，一場來自全球數百支隊伍參與的競賽，比賽的核心目標是透過機器學習的方法解決來自不同領域的異常任務：Anomalous gravitational wave signals（尋找宇宙中未知的重力波來源）、Butterfly hybrid detection （辨識突變與混種的蝴蝶品種）、Detecting sea level rise anomalous （在氣候變遷背景下，預測海平面上升的異常情況）當初看到說明簡章時，幾乎是衝著優勝隊伍可以被贊助受邀參與在費城舉辦的AAAI-25這一句話決定報名，抱著一絲優勝的希望開始拉著朋友一起參加，沒想到這看似幾乎不可能的機會，竟在兩個月後成真，得到重力波及總積分的第二名帶我們飛往美國，為在清華的第三年寫下不可思議的篇章。為了搶下總積分第一名，我們投入了所有的賽事，我們的隊名 -- 「20iterations」，20 次迭代，正如其名，報名時距離提交截止只剩 20 天，開會的頻率只能用「天」來計算，3 天一小咪、5 天一大咪，常常一討論就開到半夜，甚至出國、過年也不放過；電腦不能用就改用平板，平板不行就用手機，不知道在 Colab 上燒了幾百個運算單元","每次開會，絕對會聽到","「欸咦等一下讓我想一下」","「我覺得你說得很有道理，但是...」","「這次不可能錯了吧⋯⋯」","「真的沒有任何理由了，如果再是 0 那我也真的...」","「欸咦等一下...」","老實說，這幾句話在這一個月內，沒有 100 次也有幾十次了","這趟紐約與費城之旅，真的很神奇。","體驗了連續叫三次的Uber、在凌晨的費城街頭當起了無殼流浪漢、走進 UPenn 校園、觀戰NBA勇士對 76 人、在美術館前模仿洛基、在 Terminal Market 裡喝著熱量爆表的奶昔、時不時聞著街頭飄散的大麻味、還意外碰上川普的抗議現場。AAAI 的兩天裡，從 Agent 到 Quantum ML，見識了世界前沿的研究方向，也讓我重新思考未來可以投入的研究領域，然後看一堆台灣人硬要用英文溝通（真的很好笑，BTW我們還是優勝隊伍中唯一的大學組。接著我們抵達紐約，吃遍 Shake Shack 漢堡、煙燻牛肉三明治、塔可、龍蝦大餐，也在自由女神、華爾街銅牛、布魯克林大橋和中央公園留下足跡，時代廣場從大雨走到晴天，在 Top of the Rock 俯瞰夜晚的紐約，也唱了無數次的 I Want It That Way......","這趟如夢般的旅程，最想感謝的莫過於另外五位隊友。黑洞組最全能的鎮育與最王牌的嘉丞，沒有鎮育，許多關鍵的討論都無法延續，許多卡關的時刻也得不到解答，更不會有20iterations ，沒有嘉丞的CNN我們無法踏上美國的旅程；潮汐組最強的沂竣和點子最多的子辰，要不是題目沒有亂搞，我相信以潮汐組的成果算是模型設計裡面最縝密的，也最符合挑戰賽的宗旨，然後沂峻沒能去美國真的好可惜；蝴蝶組最挺的安楷，不只是最難的題目，而且從一開始就獨自扛起整組的重任，一路走來真的辛苦你了。或許我們沒有創造出全新的算法模型，或許只是幸運地剛好契合了測資，或許我們真正投注最多心力的不是建模，而是對規則的拆解與思辨，但即使如此，我依然深深享受每一次的推敲與突破，在每一個以為走到盡頭的時刻，總能在最後關頭迸現新的靈感與希望，不只是為了更高的成績，而是我們對真理的執著......","謝謝你們在寒假願意接下這場幾乎沒有勝算的挑戰，謝謝你們願意放下休息、在無數個爆肝深夜裡大家一起堅持到最後。從報名那刻只剩 20 天，到最後走到了費城，我們一步一步走過來，把一個看似不可能的夢想，一起變成了真實。","時間悄然流逝，時代匆匆更迭，那些曾一起經歷的日夜已化為過去，但卻也成為我心中永恆的記憶與光。","#20iterations"],"en":["The United States- a country I had always wanted to visit. Across the Pacific, I never knew when I would truly set foot on this land. Yet, through a competition that had less than a month before the deadline-and felt almost impossible to win-an email that arrived in the middle of the night suddenly made it real. That day came earlier than I ever imagined, taking me into a world that had existed only in my mind.","The NSF HDR ML Challenge is a global anomaly-detection hackathon with hundreds of teams. Its core goal is to tackle anomaly problems from different domains using machine learning: anomalous gravitational wave signals (searching for unknown sources in the universe), butterfly hybrid detection (identifying mutations and hybrid species), and detecting anomalous sea level rise (forecasting anomalies under climate change). When I first read the rules, I was almost entirely drawn by one sentence: winning teams would be sponsored and invited to AAAI-25 in Philadelphia. We signed up with a small hope-then, two months later, that \"impossible\" chance became reality. We placed 2nd overall  and earned a trip to the U.S., writing an unbelievable chapter in my third year at NTHU.","To chase the overall championship, we went all-in. Our team name-\"20iterations\"-said everything: there were only 20 days from registration to submission. Meetings were counted in days: a \"small meow\" every 3 days, a \"big meow\" every 5 days. Discussions often ran past midnight, even during travel and Lunar New Year. When the laptop failed, we used a tablet; when the tablet failed, we used a phone. I have no idea how many Colab compute units we burned through.","In every meeting, you would definitely hear:","\"Wait-hold on  let me think \"","\"You're totally right, but...\"","\"This time it can't be wrong... right...\"","\"There's literally no reason-if it's still 0, I'm going to...\"","\"Wait... hold on...\"","Honestly, in that one month, I heard these lines not 100 times, but at least dozens","The New York + Philadelphia trip was surreal: calling Uber three times in a row, becoming \"homeless wanderers\" on Philly streets at dawn, walking through UPenn, watching the Warriors vs. 76ers, imitating Rocky at the museum, drinking a calorie-bomb milkshake at Reading Terminal Market, occasionally catching the smell of weed in the air, and even bumping into a protest related to Trump. During the two days at AAAI, from Agents to Quantum ML, I saw frontier research directions and rethought what I want to pursue next. (And watching Taiwanese people insist on speaking English was genuinely hilarious-BTW, we were the only undergraduate team among the winners.)","Then we arrived in New York: Shake Shack, pastrami sandwiches, tacos, lobster feasts-and we left footprints at the Statue of Liberty, the Charging Bull, the Brooklyn Bridge, and Central Park. Times Square went from pouring rain to sunshine; we watched NYC at night from Top of the Rock; and we sang \"I Want It That Way\" countless times...","Above all, I want to thank my five teammates. Without them, there would be no \"20iterations,\" and there would be no trip to the U.S. Maybe we didn't invent a brand-new algorithm; maybe we were lucky that our approach fit the dataset. Maybe our biggest effort wasn't modeling, but dissecting the rules and thinking through the evaluation. Even so, I truly enjoyed every round of reasoning and every breakthrough-every moment when hope reappeared at the last minute. Not only for a higher score, but for our persistence toward truth.","Thank you for taking on a challenge that seemed unwinnable during winter break. Thank you for giving up rest and holding on together through countless exhausting nights. From \"20 days left\" at registration to standing in Philadelphia, we walked step by step and turned an impossible dream into reality.","Time flows quietly, and eras change quickly. Those days and nights have become the past-yet they remain an eternal memory and light in my heart.","#20iterations"]},"igem":{"title":{"en":"57 big meows, 45 small ones","zh":"57 次大咪,45 次小咪"},"place":"Paris, France","date":"2023.10.31 – 11.11","hero":"img/igem2","photos":[{"src":"img/igem2","fx":"50%","fy":"38%","role":"hero","slug":"CDG · 48.86 N, 2.35 E · 2023-11 · iGEM","cap":{"en":"Sixteen people, one gold medal","zh":"十六個人,一面金牌"}},{"src":"img/igem1","fx":"50%","fy":"45%","role":"detail","slug":"NTHU · DRY LAB · 2023","cap":{"en":"The Dry Lab bench","zh":"Dry Lab 的工作現場"}},{"src":"img/igem3","fx":"50%","fy":"42%","role":"plate","slug":"CDG · GRAND JAMBOREE · 2023-11","cap":{"en":"Presenting the diagnostic device","zh":"展示我們的診斷裝置"}},{"src":"img/igem0","fx":"50%","fy":"40%","role":"bleed","slug":"CDG · 2023-11-11 · GOLD","cap":{"en":"iGEM Grand Jamboree, Paris","zh":"巴黎 iGEM Grand Jamboree"}}],"zh":["57次大咪、45次小咪，無數的研究、報告、拉贊、採訪、交流，在2023年的11月第一次來到這麼遠的國家，10099公里--巴黎，依舊不敢相信一年後的今天我們帶著無數日月累積的成果來到了iGEM比賽會場，並最終獲得金牌，回過頭看這一年我們真的一起完成了很多事情..","記得初次相見歡的時候，那時候的我對未來十分的迷茫，沒有像其他人一樣擁有一技之長，從一開始寒假的case study到後來二擇一的主題，接著尋找適合的教授，再到後來各組各司其職，開始尋找各式模擬軟體、找model、找文獻、建網頁、做模型、搞硬體、搞軟體，一切都恍如昨日，永遠無法忘記一個禮拜兩次的meeting、討論到凌晨的會議、修正再修正的model、一起拍promotion video 、一起去林口交流會、一起被wiki 追殺的日子、一起完成檢測早期大腸癌的研究。這一年中自己也初次嘗試了各式各樣的事情，好多的第一次，第一次當組長、第一次接觸合成生物學、第一次去校園拉票、第一次3D建模、第一次連續四天睡不到六個小時、第一次搭阿聯酋、第一次離開亞洲⋯真的真的好多的第一次，在這一年中也犧牲了學業、犧牲了練球、犧牲了暑假、犧牲了睡眠，但我卻覺得一切都很值得，能跟如此優秀的15個人一起共事，並在國際合成生物學的舞台上，與數百支來自世界各國的隊伍交流，短短一年間，不同背景的我們，16個人，拿到了Gold Medal，我真的很開心也無比自豪有一群這麼厲害的隊友！","在這16人的團隊中，身為Dry lab leader（後來才知道是組內年紀最小的），負責掌管DL大小事以及擔任與其他組溝通的橋樑，我們組內每個人都來自不同的學系，很感謝DL各位很包容我的想法，也會適時的給我這不成熟的組長建議，要感謝的人和事情實在太多了，忙前忙後最扛的隊長（無數次陪我到深夜甚至黎明）、最強最全能的學姊（完全不必多說，真的什麼都強）、最忙最多事的羿文（總是要被我要求一大堆工作還有被問一大堆問題）、最神的梓維（人不在但心都在，我們QA時的神），當然還有最無敵最無解人人書卷的WL各位，以及至關重要最堅強的後盾HP，真的很開心能跟你們一起共事，一起朝向共同的目標努力，雖然比賽已經過了快一年了，但過往的回憶如今仍如夢似幻、歷歷在目...","人生很長，總會遇到很多事情，也會遇到很多人，在19歲的這年，因為遇見了你們而無比精彩。","#8th"],"en":["57 \"big meows,\" 45 \"small meows,\" countless rounds of research, reports, fundraising, interviews, and exchanges. In November 2023, I visited a country this far away for the first time-10,099 km from home: Paris. Even now, it still feels unreal that one year later, we arrived at the iGEM venue carrying the results we had built day by day, and eventually won a Gold Medal. Looking back, we truly accomplished so much together in that year.","I still remember when we first met. Back then, I was lost about the future. I didn't have a clear \"special skill\" like others. From the winter break case study, to selecting a topic, to finding the right professor, and then dividing into teams with different roles-searching for simulation tools, building models, reading papers, making the wiki, prototyping, doing hardware, doing software-everything feels like yesterday. I'll never forget the twice-a-week meetings, discussions that lasted until dawn, models revised again and again, filming promotion videos together, traveling to the Linkou meetup, being chased by the wiki deadline, and completing our research on early colorectal cancer screening.","That year, I tried so many things for the first time: being a team lead, touching synthetic biology, doing campus campaigning, 3D modeling, sleeping less than six hours for four consecutive days, flying Emirates, leaving Asia for the first time... so many firsts. I sacrificed coursework, basketball practice, my summer break, and sleep-yet I felt it was all worth it. Working with 15 incredible people, exchanging with hundreds of teams from around the world on the international synthetic biology stage-within just one year, 16 people from completely different backgrounds earned a Gold Medal. I was truly happy, and unbelievably proud to have such amazing teammates.","In this 16-person team, I served as the Dry Lab leader (and later found out I was the youngest in the group ). I handled Dry Lab tasks and acted as a bridge between subteams. Everyone came from different departments, and I'm deeply grateful that the Dry Lab members were so supportive of my ideas and gave me advice as an inexperienced leader. There are simply too many people to thank: our captain who carried everything (countless nights together until late night-or even sunrise ), our all-around senior (no need to explain-she's amazing at everything ), Yi-Wen (always overloaded with tasks and my endless questions ), Zi-Wei (not always present, but always there for us-our QA hero ), the unstoppable WL team, and our crucial backbone HP. I'm so glad we worked together toward a shared goal. Even though it has been almost a year since the competition, the memories still feel dreamlike and vivid.","Life is long. We will meet many things and many people. At 19, because I met you all, my life became incredibly bright.","#8th"]}},"portrait":{"src":"img/portrait","cap":{"en":"Hsinchu, June 2026","zh":"新竹,2026 年 6 月"}},"slider":{"src":"img/S__16670722","slug":"FORMOSA TRAIL · TAIWAN","cap":{"en":"Trail running, at night — corrupted, then retrieved","zh":"夜間越野跑 —— 加噪,然後還原"}}}</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Runtime — no framework, no build step at load time.
   1. render the bilingual content model
   2. stage the two toggles as moments, not switches
   3. run canvas figures that degrade to nothing if anything fails
   ══════════════════════════════════════════════════════════════════════ */
const DATA = JSON.parse(document.getElementById('content').textContent);
const PAGE = 'publications';
const root = document.documentElement;
const reduced = () => root.dataset.motion === 'reduced';

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
/** Emit both language variants; CSS reveals exactly one. */
const bi = (o, tag = 'span', cls = '') => {
  const c = cls ? ` class="${cls}"` : '';
  return `<${tag}${c} data-en>${esc(o?.en ?? '')}</${tag}><${tag}${c} data-zh>${esc(o?.zh ?? '')}</${tag}>`;
};

/* ── toggles ──────────────────────────────────────────────────────── */
function swap(fn) {
  if (document.startViewTransition && !reduced()) document.startViewTransition(fn);
  else fn();
}
const themeBtn = document.getElementById('theme-btn');
const langBtn = document.getElementById('lang-btn');
function syncSwitches() {
  const light = root.dataset.theme === 'light';
  themeBtn.setAttribute('role', 'switch');
  themeBtn.setAttribute('aria-checked', String(light));
  themeBtn.querySelector('[data-en]').innerHTML = light ? '<b>PAPER</b>' : '<b>PHOSPHOR</b>';
  themeBtn.querySelector('[data-zh]').innerHTML = light ? '<b>紙本</b>' : '<b>螢光</b>';
  langBtn.setAttribute('aria-pressed', String(root.dataset.lang === 'zh'));
}
themeBtn.addEventListener('click', () => swap(() => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  root.style.colorScheme = next;
  try { localStorage.setItem('theme', next); } catch {}
  window.dispatchEvent(new Event('themechange'));
  window.dispatchEvent(new CustomEvent('site:theme', { detail: { theme: next } }));
  syncSwitches();
}));
langBtn.addEventListener('click', () => {
  const anchors = [...document.querySelectorAll('[data-section]')];
  const anchor = anchors.filter(el => el.getBoundingClientRect().top <= innerHeight * .35).at(-1) || anchors[0];
  const before = anchor?.getBoundingClientRect().top || 0;
  swap(() => {
  const next = root.dataset.lang === 'en' ? 'zh' : 'en';
  root.dataset.lang = next;
  root.lang = next === 'zh' ? 'zh-Hant' : 'en';
  try { localStorage.setItem('lang', next); } catch {}
  window.dispatchEvent(new Event('langchange'));
  window.dispatchEvent(new CustomEvent('site:language', { detail: { language: next } }));
  syncSwitches();
  requestAnimationFrame(() => {
    const after = anchor?.getBoundingClientRect().top || before;
    scrollBy({ top: after - before, behavior: 'instant' });
  });
  });
});
syncSwitches();

/* ── header ───────────────────────────────────────────────────────── */
const topbar = document.getElementById('top');
const topSentinel = document.createElement('span');
topSentinel.className = 'top-sentinel';
topSentinel.setAttribute('aria-hidden', 'true');
document.body.prepend(topSentinel);
new IntersectionObserver(([entry]) => { topbar.dataset.stuck = entry.isIntersecting ? '0' : '1'; }).observe(topSentinel);

/* ── reveal ───────────────────────────────────────────────────────── */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { rootMargin: '0px 0px -10% 0px' });
const observeAll = () => document.querySelectorAll('.rise:not(.in)').forEach(el => io.observe(el));

/* ══════════════════════════════════════════════════════════════════════
   PAGE RENDERERS
   One function per page. build_site.py picks the one it needs and inlines
   it, so every page ships as a self-contained static file with no client
   -side routing and no fetch-on-load.
   ══════════════════════════════════════════════════════════════════════ */

const PAGES = [
  { id: 'index',        href: './',                  en: 'Home',         zh: '首頁' },
  { id: 'research',     href: 'research.html',       en: 'Research',     zh: '研究' },
  { id: 'publications', href: 'publications.html',   en: 'Publications', zh: '論文' },
  { id: 'field',        href: 'field.html',          en: 'Field',        zh: '現場' },
  { id: 'record',       href: 'record.html',         en: 'Record',       zh: '歷程' },
  { id: 'about',        href: 'about.html',          en: 'About',        zh: '關於' },
];

document.getElementById('nav').innerHTML = PAGES.map(p =>
  `<a href="${p.href}"${p.id === PAGE ? ' class="on" aria-current="page"' : ''}
      ><span data-en>${p.en}</span><span data-zh>${p.zh}</span></a>`
).join('');

const secHead = (n, t, sub) => `
  <div class="sec-head">
    <span class="sec-n">${n}</span>
    <h2 class="sec-t">${bi(t)}</h2>
  </div>
  ${sub ? `<p class="lead rise">${bi(sub)}</p>` : ''}`;

/** Next/previous footer that previews where you are going. */
const pager = (id) => {
  const i = PAGES.findIndex(p => p.id === id);
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  const cell = (p, dir) => !p ? '<span></span>' : `
    <a class="pager-link" href="${p.href}" data-dir="${dir}">
      <span class="label">${dir === 'next' ? bi({ en: 'Next', zh: '下一頁' }) : bi({ en: 'Previous', zh: '上一頁' })}</span>
      <span class="pager-t"><span data-en>${p.en}</span><span data-zh>${p.zh}</span></span>
    </a>`;
  return `<nav class="pager wrap" aria-label="Pagination / 分頁">${cell(prev, 'prev')}${cell(next, 'next')}</nav>`;
};

/* ── shared blocks ──────────────────────────────────────────────────── */
/** One photograph, framed like a scientific plate: hairline inset, mono slug, grain. */
const plate = (ph, opt) => {
  const o = opt || {};
  const ar = o.ar || '3/2';
  return `
  <figure class="ph ${o.cls || ''}" style="--ar:${ar};--thumb:url('${esc(ph.src)}.thumb.webp')">
    <img src="${esc(ph.src)}.webp" alt="${esc(ph.cap.en)}"
         data-alt-en="${esc(ph.cap.en)}" data-alt-zh="${esc(ph.cap.zh)}"
         style="--fx:${esc(ph.fx || '50%')};--fy:${esc(ph.fy || '50%')}"
         ${o.vt ? `data-vt="${esc(o.vt)}"` : ''}
         ${o.eager ? 'fetchpriority="high"' : 'loading="lazy" decoding="async"'}
         onload="this.closest('.ph').dataset.loaded='1'">
    <figcaption>
      <span class="ph-cap">${bi(ph.cap)}</span>
      <span class="ph-slug mono">${esc(ph.slug || '')}</span>
    </figcaption>
  </figure>`;
};

const galleryHTML = (photos) => !photos?.length ? '' : `
  <div class="gal">
    ${photos.map((ph, i) => `
      <figure class="shot" data-i="${i}" style="--thumb:url('${esc(ph.src)}.thumb.webp')">
        <img src="${esc(ph.src)}.webp" alt="${esc(ph.cap.en)}"
             data-alt-en="${esc(ph.cap.en)}" data-alt-zh="${esc(ph.cap.zh)}" loading="lazy" decoding="async"
             onload="this.parentElement.dataset.loaded='1'">
        <figcaption class="label">${bi(ph.cap)}</figcaption>
      </figure>`).join('')}
  </div>`;

const paperItem = p => `
  <li class="paper rise" data-status="${p.status}" data-paper-id="${esc(p.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''))}">
    <div class="paper-year mono">${esc(p.year)}</div>
    <div class="paper-main">
      <h3 class="paper-title">${esc(p.title)}</h3>

const typing = el => el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
const composing = e => e.isComposing || e.keyCode === 229;

/* ── I12 · magic-line nav indicator ─────────────────────────────────── */
(() => {
  const nav = document.getElementById('nav');
  if (!nav) return;
  const line = document.createElement('span');
  line.className = 'nav-ind';
  nav.appendChild(line);
  const move = a => {
    if (!a) return;
    nav.style.setProperty('--ind-x', a.offsetLeft + 'px');
    nav.style.setProperty('--ind-w', a.offsetWidth + 'px');
    nav.dataset.ind = '1';
  };
  const rest = () => move(nav.querySelector('a.on')) || (nav.dataset.ind = nav.querySelector('a.on') ? '1' : '0');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('pointerenter', () => move(a));
    a.addEventListener('focus', () => move(a));
  });
  nav.addEventListener('pointerleave', rest);
  addEventListener('load', rest);
  rest();
})();

/* ── I8 / M8 · theme wipe: a circle expanding from the button ───────── */
(() => {
  const btn = document.getElementById('theme-btn');
  if (!btn) return;
  btn.addEventListener('pointerdown', e => {
    const r = btn.getBoundingClientRect();
    document.documentElement.style.setProperty('--wipe-x', (r.left + r.width / 2) + 'px');
    document.documentElement.style.setProperty('--wipe-y', (r.top + r.height / 2) + 'px');
    const far = Math.hypot(Math.max(e.clientX, innerWidth - e.clientX),
                           Math.max(e.clientY, innerHeight - e.clientY));
    document.documentElement.style.setProperty('--wipe-r', far + 'px');
  });
})();

(() => {
  const items = [
    ...PAGES.map(p => ({ en: p.en, zh: p.zh, roman: p.id, href: p.href, kind: 'page' })),
    ...(DATA.publications || []).map(p => ({

/* ── I2 · noise dial — drag the corruption up until retrieval fails ─── */
function mountNoiseDial() {
  if (PAGE !== 'index') return;
  const hero = document.getElementById('hero');
  if (!hero) return;
  // site_hero.js is concatenated after this file and boots on document.fonts.ready,
  // so poll briefly for its hook rather than assuming it is already there.
  if (!window.__retrieve) { setTimeout(mountNoiseDial, 120); return; }
  if (document.querySelector('.dial')) return;

  const el = document.createElement('div');
  el.className = 'dial wrap';
  el.innerHTML = `
    <label class="dial-l label" for="noise">
      <span data-en>Corrupt the cue</span><span data-zh>破壞線索</span>
    </label>
    <input id="noise" type="range" min="0" max="60" value="42" step="1"
           aria-label="${root.dataset.lang === 'zh' ? '線索擾動程度' : 'Corruption level'}"
           data-label-en="Corruption level" data-label-zh="線索擾動程度"
           aria-describedby="dial-out">
    <output id="dial-out" class="mono"></output>`;
  hero.after(el);

  const range = el.querySelector('#noise'), out = el.querySelector('#dial-out');
  let t = 0;
  const label = () => {
    const en = root.dataset.lang === 'en';
    const p = +range.value;
    const metrics = window.HeroController?.getMetrics?.();
    const m = Number.isFinite(metrics?.targetOverlap)
      ? metrics.targetOverlap
      : (window.__overlap ? window.__overlap() : 0);
    const failed = m < 0.9;
    out.innerHTML =
      `<b>${p}%</b> ${en ? 'bit-flip' : '位元翻轉'} · ` +
      `${en ? 'overlap' : '重疊'} <b>${m.toFixed(2)}</b> ` +
      `<span class="${failed ? 'bad' : 'good'}">${failed
        ? (en ? 'retrieval failed' : '檢索失敗')
        : (en ? 'retrieved' : '檢索成功')}</span>`;
  };
  range.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (window.HeroController?.setCorruption) window.HeroController.setCorruption(+range.value / 100);
      else window.__retrieve?.(+range.value / 100);
    }, 90);
    label();
  });
  setInterval(label, 400);
  label();
}
mountNoiseDial();


/* ── I6 · reading progress — a 1:1 map of the reader's own scroll ────── */
(() => {
  const body = document.getElementById('essay-body');
  const fill = document.getElementById('toc-fill');
  const pct = document.getElementById('toc-pct');
  if (!body || !fill) return;
  const paras = [...body.querySelectorAll('p')].filter(p => getComputedStyle(p).display !== 'none');
  let current = 0;
  const measure = i => {
    current = Math.max(current, i);
    const done = paras.length < 2 ? 1 : current / (paras.length - 1);
    fill.style.width = (done * 100).toFixed(1) + '%';
    if (pct) pct.textContent = Math.round(done * 100) + '%';
  };
  const progressIO = new IntersectionObserver(entries => {
    entries.filter(e => e.isIntersecting).forEach(e => measure(paras.indexOf(e.target)));
  }, { rootMargin: '-38% 0px -48% 0px', threshold: 0 });
  paras.forEach(p => progressIO.observe(p));
  measure(0);
})();

/* ── I18 · comparison slider — the hero's corruption model, on a photo ─ */
(() => {
  const wrap = document.getElementById('cmp');
  const cvs = document.getElementById('cmp-noise');
  const range = document.getElementById('cmp-r');
  if (!wrap || !cvs || !range) return;
  const src = wrap.querySelector('.cmp-a');
  const ctx = cvs.getContext('2d', { willReadFrequently: true });
  if (!ctx) return;

  let base = null, rank = null;
  const paint = () => {
    if (!base) return;
    const p = +range.value / 100;
    const out = ctx.createImageData(base);
    const b = base.data, o = out.data;
    // Same idea as the lattice: flip a fraction of the samples. On an image that
    // means pushing pixels to one extreme or the other, which is what a corrupted
    // cue actually looks like before retrieval.
    for (let i = 0; i < b.length; i += 4) {
      const n = i / 4;
      if (rank[n] < p) {
        const v = rank[(n * 17 + 31) % rank.length] < 0.5 ? 0 : 255;
        o[i] = v; o[i + 1] = v; o[i + 2] = v;
      } else {
        o[i] = b[i]; o[i + 1] = b[i + 1]; o[i + 2] = b[i + 2];
      }
      o[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  };

  const load = () => {
    const w = Math.min(720, src.naturalWidth || 720);
    const h = Math.round(w * (src.naturalHeight || 480) / (src.naturalWidth || 720));
    cvs.width = w; cvs.height = h;
    ctx.drawImage(src, 0, 0, w, h);
    base = ctx.getImageData(0, 0, w, h);
    const random = window.SiteRuntime?.seededRandom?.('field-corruption') || (() => {
      let s = 0x9e3779b9;
      return () => ((s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296));
    })();
    rank = Array.from({ length: w * h }, random);
    paint();
  };
  if (src.complete && src.naturalWidth) load();
  else src.addEventListener('load', load);

  let t = 0;
  const onInput = () => {
    wrap.style.setProperty('--pos', range.value + '%');
    clearTimeout(t);
    t = setTimeout(paint, 60);
  };
  range.addEventListener('input', onInput);
  wrap.style.setProperty('--pos', range.value + '%');
})();

    const copyText = async text => {
      try { await navigator.clipboard.writeText(text); return true; } catch {}
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    };
    papers.forEach((p, i) => {
      const main = p.querySelector('.paper-main');
      const tools = document.createElement('div');
      tools.className = 'paper-tools mono';
      tools.innerHTML = `<button type="button" data-cite>${pair('Copy citation', '複製引用')}</button>
        <details class="evidence"><summary>${pair('Evidence', '證據')}</summary>
          <p>${pair('Status is displayed exactly as recorded in the public content model.', '狀態完全依照公開內容模型中的紀錄顯示。')}</p>
        </details>`;
      main.appendChild(tools);
      tools.querySelector('[data-cite]').addEventListener('click', async () => {
        const citation = [p.querySelector('.paper-authors')?.innerText, p.querySelector('.paper-title')?.innerText,
          p.querySelector('.paper-venue')?.innerText, p.querySelector('.paper-year')?.innerText].filter(Boolean).map(x => x.trim()).join('. ');
        const ok = await copyText(citation);
        live.textContent = ok ? (isZh() ? '引用已複製。' : 'Citation copied.') : (isZh() ? '無法複製。' : 'Copy failed.');
      });

      if (i < 2) mountDenoise(main, i === 0 ? 'HOPE' : 'LANGEVIN', i);
    });
  })();

  function mountDenoise(host, word, seed) {
    const fig = document.createElement('figure');
    fig.className = 'paper-acq';
    fig.innerHTML = `<canvas width="360" height="104" aria-hidden="true"></canvas><figcaption>${pair('Conceptual denoise acquisition—not benchmark data', '概念性去噪擷取——並非基準資料')}</figcaption>`;
    host.prepend(fig);
    const cvs = fig.querySelector('canvas'), ctx = cvs.getContext('2d');
    if (!ctx) return;
    const cols = 90, rows = 26, off = document.createElement('canvas'); off.width = cols; off.height = rows;
    const o = off.getContext('2d');
    o.fillStyle = '#fff'; o.font = `bold ${word.length > 5 ? 15 : 20}px system-ui`; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText(word, cols / 2, rows / 2);
    const target = o.getImageData(0, 0, cols, rows).data;
    const rnd = RT.seededRandom ? RT.seededRandom(`paper-${seed}`) : (() => { let x = 12345 + seed; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); })();
    const rank = Array.from({ length: cols * rows }, () => rnd());
    const draw = k => {
      const accent = getComputedStyle(root).getPropertyValue('--accent').trim();
      const ink = getComputedStyle(root).getPropertyValue('--ink').trim();
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const sx = cvs.width / cols, sy = cvs.height / rows;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const n = j * cols + i, bit = target[n * 4 + 3] > 20;
        const resolved = rank[n] < k;
        const on = resolved ? bit : rank[(n * 17 + 11) % rank.length] > .5;
        if (!on) continue;
        ctx.globalAlpha = resolved ? .9 : .24;
        ctx.fillStyle = resolved ? ink : accent;
        ctx.fillRect(i * sx, j * sy, Math.max(1, sx - .6), Math.max(1, sy - .6));
      }
      ctx.globalAlpha = 1;
    };
    const start = () => {
      if (isReduced() || !RT.loop) { draw(1); return; }
      let elapsed = 0;
      RT.loop.claim(`paper-${seed}`, (_now, dt) => {
        elapsed += dt; draw(Math.min(1, elapsed / 680));
        return elapsed < 680;
      });
    };
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); start(); } }, { threshold: .45 });
    io.observe(fig); draw(isReduced() ? 1 : 0);
  }

  /* V38 — focus mode moves attention, never the essay paragraphs themselves. */
  (() => {
    const body = document.getElementById('essay-body');
    if (!body) return;
    const tools = document.createElement('div');
    tools.className = 'essay-tools mono';
    tools.innerHTML = `<button type="button" aria-pressed="false">${pair('Focus paragraphs', '段落聚焦')}</button><span class="essay-index"></span>`;
    body.before(tools);
    const paras = [...body.querySelectorAll('p')];
    paras.forEach((p, i) => { p.dataset.paragraph = String(i + 1); p.tabIndex = -1; });
    const label = tools.querySelector('.essay-index');
    const choose = p => {
      paras.forEach(x => x.classList.toggle('current', x === p));
      label.textContent = `${String(paras.indexOf(p) + 1).padStart(2, '0')} / ${String(paras.length).padStart(2, '0')}`;
    };
    tools.querySelector('button').addEventListener('click', e => {
      const on = body.dataset.focus === '1'; body.dataset.focus = on ? '0' : '1';
      e.currentTarget.setAttribute('aria-pressed', String(!on)); if (!on) choose(paras[0]);
    });
    body.addEventListener('click', e => { const p = e.target.closest('p'); if (p && body.dataset.focus === '1') choose(p); });
    let pIndex = 0;
    addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229 || body.dataset.focus !== '1') return;
      if (e.key === 'j' || e.key === 'k') {
        e.preventDefault(); pIndex = Math.max(0, Math.min(paras.length - 1, pIndex + (e.key === 'j' ? 1 : -1)));
        choose(paras[pIndex]); paras[pIndex].scrollIntoView({ block: 'center', behavior: isReduced() ? 'auto' : 'smooth' });
      }
    });
  })();

  /* V39/V40 — factual event raster and useful, quiet contact utilities. */
  (() => {
    if (PAGE !== 'about') return;
    const awards = DATA.awards || [], pubs = DATA.publications || [];
    const events = [...awards.map(a => ({ year: +a.year, title: `${a.title.en} / ${a.title.zh}`, type: 'award' })),
      ...pubs.map(p => ({ year: +p.year, title: p.title, type: 'paper' }))].filter(e => Number.isFinite(e.year));
    const host = document.querySelector('.awards')?.closest('.sec');
    if (host && events.length) {
      const min = Math.min(...events.map(e => e.year)), max = Math.max(...events.map(e => e.year));
      const lanes = { award: 76, paper: 150 }, counts = {};
      const raster = document.createElement('section'); raster.className = 'career-raster';
      raster.innerHTML = `<header><p class="label">${pair('Selected public record', '精選公開紀錄')}</p><h2>${pair('Events in time', '時間中的事件')}</h2></header>
        <svg viewBox="0 0 1000 220" role="img" aria-label="Career event raster / 生涯事件光柵">
          <path class="career-axis" d="M70 188H940"/>
          ${Array.from({ length: max - min + 1 }, (_, i) => { const x = 90 + i / Math.max(1, max - min) * 820; return `<g><path d="M${x} 180V196"/><text x="${x}" y="215">${min + i}</text></g>`; }).join('')}
          ${events.map((e, i) => { const x = 90 + (e.year - min) / Math.max(1, max - min) * 820 + ((counts[e.year + e.type] = (counts[e.year + e.type] || 0) + 1) - 1) * 10; return `<g class="career-event" tabindex="0"><title>${esc(e.title)}</title><path d="M${x} 180V${lanes[e.type]}"/><circle cx="${x}" cy="${lanes[e.type]}" r="5"/><text x="${x + 9}" y="${lanes[e.type] + 4}">${e.type === 'award' ? 'A' : 'P'}</text></g>`; }).join('')}
        </svg><p class="label">A = ${pair('award', '獎項')} · P = ${pair('publication', '著作')}</p>`;
      host.after(raster);
    }

    const contact = document.querySelector('.contact-links');
    if (!contact) return;
    const utilities = document.createElement('div'); utilities.className = 'contact-utils mono';
    utilities.innerHTML = `<button type="button" data-copy-email aria-label="${isZh() ? '複製電子郵件' : 'Copy email'}"
      data-label-en="Copy email" data-label-zh="複製電子郵件">${pair('Copy email', '複製電子郵件')}</button>
      <span class="taipei-time" aria-live="off"></span><span class="copy-live sr-live" aria-live="polite"></span>`;
    contact.after(utilities);
    const clock = utilities.querySelector('.taipei-time');
    const tick = () => { clock.textContent = `${isZh() ? '臺北' : 'TAIPEI'} · ${new Intl.DateTimeFormat(root.lang, { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date())}`; };
    tick(); addEventListener('langchange', tick); const timer = setInterval(tick, 60000); addEventListener('pagehide', () => clearInterval(timer), { once: true });
    utilities.querySelector('[data-copy-email]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(DATA.meta.email); utilities.querySelector('.copy-live').textContent = isZh() ? '已複製。' : 'Copied.'; }
      catch { utilities.querySelector('.copy-live').textContent = isZh() ? '請直接選取上方地址。' : 'Select the address above.'; }
    });
  })();
})();


/* ======================================================================
   SPATIAL CONTINUITY
   V3 deliberately contains no ambient canvas and no kinetic scroll skew.
   Spectacle comes from the real figures; this file only preserves identity
   while moving between documents.
   ====================================================================== */
(() => {
  const order = ['index', 'research', 'publications', 'field', 'field-nsf', 'field-igem', 'record', 'about', '404'];
  const reduced = () => root.dataset.motion === 'reduced';
  const meter = document.createElement('div');
  meter.className = 'nav-transit mono';
  meter.setAttribute('aria-hidden', 'true');
  meter.innerHTML = '<span></span><i></i>';
  document.body.appendChild(meter);

  const writeIntent = (href, label) => {
    const u = new URL(href, location.href);
    const file = u.pathname.split('/').pop() || 'index.html';
    const id = file.replace('.html', '') || 'index';
    const a = Math.max(0, order.indexOf(PAGE));
    const b = Math.max(0, order.indexOf(id));
    const direction = b > a ? 'deeper' : b < a ? 'shallower' : 'lateral';
    const intent = { from: PAGE, to: id, direction, label: label.slice(0, 48) };
    try { sessionStorage.setItem('site:navigation', JSON.stringify(intent)); } catch {}
    return intent;
  };

  document.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
    const u = new URL(a.href, location.href);
    if (u.origin !== location.origin || u.pathname === location.pathname) return;
    const visible = a.querySelector(root.dataset.lang === 'zh' ? '[data-zh]' : '[data-en]');
    const intent = writeIntent(a.href, (visible || a).textContent.trim());
    root.dataset.navDirection = intent.direction;
    meter.querySelector('span').textContent = intent.label;
    if (!reduced()) meter.dataset.on = '1';
  }, true);

  addEventListener('pageswap', e => {
    if (reduced() || !e.viewTransition) return;
    root.dataset.navigating = '1';
  });

  addEventListener('pagereveal', e => {
    let intent = null;
    try { intent = JSON.parse(sessionStorage.getItem('site:navigation') || 'null'); } catch {}
    if (intent) {
      root.dataset.navDirection = intent.direction;
      meter.querySelector('span').textContent = intent.label;
    }
    root.dataset.navigating = '0';
    meter.dataset.on = '0';
    if (e.viewTransition) e.viewTransition.finished.finally(() => {
      document.querySelectorAll('[style*="view-transition-name"]').forEach(el => {
        if (!el.dataset.vt) el.style.viewTransitionName = '';
      });
    });
  });

  /* Only the object that was actually aimed at receives a transition name. */
  document.addEventListener('pointerdown', e => {
    const a = e.target.closest('a[href]');
    const image = a?.querySelector('img[data-vt]');
    if (!image || reduced()) return;
    const r = image.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return;
    document.querySelectorAll('img[data-vt]').forEach(x => { x.style.viewTransitionName = x === image ? x.dataset.vt : ''; });
  }, true);
})();


observeAll();
</script>
</body>
</html>
